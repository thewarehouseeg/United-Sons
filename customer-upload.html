<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>United Sons Moving — Send Your Photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0a0a; --white:#ffffff; --red:#ef132c;
    --paper:#f6f5f3; --graphite:#4a4a4a; --line:#e3e1dc; --green:#1c7a4d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--paper); color:var(--black);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  header{ background:var(--black); padding:20px 18px; }
  header img{ height:26px; }

  main{ max-width:480px; margin:0 auto; padding:24px 18px 40px; }

  h1{
    font-family:'Archivo',sans-serif; font-size:21px; font-weight:700;
    margin:0 0 6px;
  }
  p.sub{ font-size:14px; color:var(--graphite); line-height:1.5; margin:0 0 24px; }

  .drop-zone{
    border:2px dashed var(--line); border-radius:8px;
    padding:32px 16px; text-align:center; margin-bottom:16px;
    background:var(--white);
  }
  .drop-zone .icon{ font-size:32px; margin-bottom:8px; }
  .drop-zone .txt{ font-size:14px; color:var(--graphite); }

  input[type=file]{ display:none; }

  .btn{
    display:flex; align-items:center; justify-content:center; width:100%;
    padding:14px 18px; border-radius:4px; border:none;
    font-family:'Archivo',sans-serif; font-weight:600; font-size:15px;
    cursor:pointer; margin-bottom:10px;
  }
  .btn-primary{ background:var(--red); color:var(--white); }
  .btn-outline{ background:var(--white); color:var(--black); border:1.5px solid var(--black); }
  .btn:disabled{ opacity:0.4; }

  .thumbs{ display:flex; gap:8px; flex-wrap:wrap; margin:16px 0; }
  .thumbs img{
    width:76px; height:76px; object-fit:cover; border-radius:4px; border:1px solid var(--line);
  }

  .status-box{
    font-size:13.5px; color:var(--graphite); margin:10px 0 16px; line-height:1.5;
  }

  .success{
    text-align:center; padding:40px 10px;
  }
  .success .check{
    width:56px; height:56px; border-radius:50%; background:var(--green);
    color:var(--white); display:flex; align-items:center; justify-content:center;
    font-size:28px; margin:0 auto 16px;
  }
  .success h2{ font-family:'Archivo',sans-serif; font-size:19px; margin:0 0 8px; }
  .success p{ font-size:14px; color:var(--graphite); line-height:1.5; }

  .error-box{
    text-align:center; padding:50px 20px; color:var(--graphite);
  }
  .error-box .big{ font-family:'Archivo',sans-serif; font-weight:700; font-size:17px; color:var(--black); margin-bottom:6px; }
</style>
</head>

/* Compress an image file down to a small JPEG data URL so it fits safely

function compressImage(file, maxDim = 1000, quality = 0.6){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e)=>{ img.src = e.target.result; };

      if(width > height && width > maxDim){

        width = maxDim;

        width = Math.round(width * (maxDim / height));
        height = maxDim;
      }

      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);

      let dataUrl = canvas.toDataURL('image/jpeg', q);
      // Keep shrinking quality until safely under Firestore's ~1MB doc limit
      while(dataUrl.length > 700000 && q > 0.2){
        q -= 0.1;
        dataUrl = canvas.toDataURL('image/jpeg', q);
      }
      resolve(dataUrl);
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function init(){
  if(!jobId){
    return showError('No job reference found', 'This link is missing a reference. Please ask United Sons Moving to resend it.');
  }
  let jobSnap;
  try{
    jobSnap = await getDoc(doc(db, "jobs", jobId));
  }catch(e){
    return showError('Could not load your file', 'Please check your connection and reload the page.');
  }
  if(!jobSnap.exists()){
    return showError('File not found', 'This link may have expired. Please ask United Sons Moving to resend it.');
  }
  const job = jobSnap.data();
  renderForm(job);
}

function showError(big, p){
  main.innerHTML = `<div class="error-box"><div class="big">${esc(big)}</div><p>${esc(p)}</p></div>`;
}

function esc(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderForm(job){
  main.innerHTML = `
    <h1>Hi ${esc(job.name || '')}, send us your photos</h1>
    <p class="sub">Take clear photos of the furniture and items you're moving from ${esc(job.pickup || 'your place')}. This helps us prepare an accurate quote.</p>

    <label class="drop-zone" for="fileInput">
      <div class="icon">📷</div>
      <div class="txt">Tap to choose or take photos</div>
    </label>
    <input type="file" id="fileInput" accept="image/*" multiple capture="environment">

    <div id="thumbs" class="thumbs"></div>
    <div id="statusBox" class="status-box"></div>

    <button class="btn btn-primary" id="uploadBtn" disabled>Send photos</button>
  `;

  const fileInput = document.getElementById('fileInput');
  const thumbs = document.getElementById('thumbs');
  const uploadBtn = document.getElementById('uploadBtn');
  const statusBox = document.getElementById('statusBox');

  fileInput.addEventListener('change', (e)=>{
    selectedFiles = Array.from(e.target.files);
    thumbs.innerHTML = selectedFiles.map(f=>`<img src="${URL.createObjectURL(f)}">`).join('');
    uploadBtn.disabled = selectedFiles.length===0;
    statusBox.textContent = selectedFiles.length ? `${selectedFiles.length} photo(s) ready to send.` : '';
  });

  uploadBtn.addEventListener('click', async ()=>{
    if(selectedFiles.length===0) return;
    uploadBtn.disabled = true;
    uploadBtn.textContent = 'Sending…';
    try{
      const photosCol = collection(db, "jobs", jobId, "photos");
      const previews = [];
      for(let i=0; i<selectedFiles.length; i++){
        statusBox.textContent = `Preparing photo ${i+1} of ${selectedFiles.length}…`;
        const dataUrl = await compressImage(selectedFiles[i]);
        statusBox.textContent = `Sending photo ${i+1} of ${selectedFiles.length}…`;
        await addDoc(photosCol, { data: dataUrl, uploadedAt: Date.now() });
        previews.push(dataUrl);
      }
      showSuccess(previews);
    }catch(e){
      statusBox.textContent = 'Something went wrong sending your photos. Please try again.';
      uploadBtn.disabled = false;
      uploadBtn.textContent = 'Send photos';
    }
  });
}

function showSuccess(urls){
  main.innerHTML = `
    <div class="success">
      <div class="check">✓</div>
      <h2>Photos received</h2>
      <p>Thank you — your photos have been sent to United Sons Moving Services. We'll prepare your quote and follow up shortly.</p>
      <div class="thumbs" style="justify-content:center; margin-top:20px;">
        ${urls.map(u=>`<img src="${u}">`).join('')}
      </div>
    </div>
  `;
}

init();
</script>

</html>
