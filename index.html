<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>United Sons Moving — Job Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0a0a;
    --white:#ffffff;
    --red:#ef132c;
    --paper:#f6f5f3;
    --graphite:#4a4a4a;
    --line:#e3e1dc;
    --card:#ffffff;
    --amber:#c98a1c;
    --green:#1c7a4d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--black);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:76px;
  }
  h1,h2,h3,.label-font{font-family:'Archivo',sans-serif;}

  /* Header */
  header{
    background:var(--black);
    color:var(--white);
    padding:18px 18px 16px;
  }
  header .brand-logo{
    display:flex; align-items:center;
  }
  header .brand-logo .logo-chip{
    background:var(--white);
    padding:6px 12px;
    border-radius:4px;
    display:inline-flex;
    align-items:center;
  }
  header .brand-logo img{
    height:28px; width:auto; display:block;
  }
  header .view-title{
    margin-top:6px; font-size:22px; font-weight:700; font-family:'Archivo',sans-serif;
  }

  main{padding:16px; max-width:640px; margin:0 auto;}

  /* Sticky wrapper holding header + search bar together */
  .top-sticky{
    position:sticky; top:0; z-index:20;
  }

  /* Search bar */
  .search-bar{
    background:var(--paper);
    padding:12px 16px 8px;
    border-bottom:1px solid var(--line);
  }
  .search-bar input{
    width:100%; padding:11px 14px; border:1.5px solid var(--line);
    border-radius:20px; font-size:15px; font-family:'Inter',sans-serif;
    background:var(--white); color:var(--black);
    max-width:608px; margin:0 auto; display:block;
  }
  .search-bar input:focus{ outline:none; border-color:var(--black); }

  /* Tab bar */
  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0;
    background:var(--black);
    display:flex;
    border-top:1px solid #262626;
    z-index:30;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:#8a8a8a;
    font-family:'Archivo',sans-serif; font-weight:600; font-size:12.5px;
    padding:12px 4px 14px; display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  nav.tabbar button.active{color:var(--white);}
  nav.tabbar button .dot{
    width:5px; height:5px; border-radius:50%; background:transparent;
  }
  nav.tabbar button.active .dot{background:var(--red);}

  /* Buttons */
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    padding:13px 18px; border-radius:3px; border:none;
    font-family:'Archivo',sans-serif; font-weight:600; font-size:14.5px;
    cursor:pointer;
  }
  .btn-primary{background:var(--red); color:var(--white);}
  .btn-primary:active{background:#c80f24;}
  .btn-dark{background:var(--black); color:var(--white);}
  .btn-outline{background:transparent; color:var(--black); border:1.5px solid var(--black);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:0.4;}

  .fab{
    position:fixed; right:18px; bottom:90px; z-index:25;
    width:56px; height:56px; border-radius:4px;
    background:var(--red); color:var(--white); border:none;
    font-size:28px; line-height:1; font-weight:400;
    box-shadow:0 6px 16px rgba(0,0,0,0.25);
  }

  /* Cards */
  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:4px; padding:14px 14px 12px; margin-bottom:10px;
    position:relative;
  }
  .card .top-row{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .card .name{font-size:16px; font-weight:700; font-family:'Archivo',sans-serif;}
  .card .route{font-size:13px; color:var(--graphite); margin-top:3px; line-height:1.4;}
  .card .meta-row{
    display:flex; gap:12px; margin-top:9px; font-size:12px; color:var(--graphite);
    flex-wrap:wrap;
  }
  .card .meta-row span{display:flex; align-items:center; gap:4px;}

  /* Status stamp */
  .stamp{
    font-family:'Archivo',sans-serif; font-weight:700; font-size:10.5px;
    padding:4px 8px; border-radius:2px; white-space:nowrap;
    border:1.5px solid currentColor; letter-spacing:0.3px;
  }
  .stamp.lead{color:var(--graphite);}
  .stamp.survey{color:var(--amber);}
  .stamp.quoted{color:#1c5fa8;}
  .stamp.confirmed{color:var(--green);}
  .stamp.ops{color:var(--red);}

  /* Empty state */
  .empty{
    text-align:center; padding:60px 20px 40px; color:var(--graphite);
  }
  .empty .big{font-family:'Archivo',sans-serif; font-weight:700; font-size:17px; color:var(--black); margin-bottom:6px;}
  .empty p{font-size:13.5px; line-height:1.5; margin:0;}

  /* Section labels */
  .section-label{
    font-family:'Archivo',sans-serif; font-weight:700; font-size:13px;
    color:var(--graphite); margin:18px 0 8px; padding-bottom:6px;
    border-bottom:1.5px solid var(--black);
  }
  .section-label:first-child{margin-top:0;}

  /* Modal / sheet */
  .overlay{
    position:fixed; inset:0; background:rgba(10,10,10,0.55);
    z-index:50; display:flex; align-items:flex-end;
  }
  .sheet{
    background:var(--white); width:100%; max-height:92vh; overflow-y:auto;
    border-radius:14px 14px 0 0; padding:18px 18px 28px;
    animation:slideup 0.22s ease-out;
  }
  @keyframes slideup{from{transform:translateY(24px); opacity:0.4;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:2px; margin:0 auto 14px;}
  .sheet h2{font-size:19px; margin:0 0 4px;}
  .sheet .sheet-sub{font-size:12.5px; color:var(--graphite); margin-bottom:16px;}

  .field{margin-bottom:14px;}
  .field label{
    display:block; font-size:12px; font-weight:600; color:var(--graphite);
    margin-bottom:5px; font-family:'Archivo',sans-serif;
  }
  .field input, .field textarea, .field select{
    width:100%; padding:11px 12px; border:1.5px solid var(--line);
    border-radius:4px; font-size:15px; font-family:'Inter',sans-serif;
    background:var(--white); color:var(--black);
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none; border-color:var(--black);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  .radio-group{display:flex; gap:8px;}
  .radio-opt{
    flex:1; border:1.5px solid var(--line); border-radius:4px;
    padding:10px; text-align:center; font-size:13.5px; font-weight:600;
    font-family:'Archivo',sans-serif; color:var(--graphite); cursor:pointer;
  }
  .radio-opt.selected{border-color:var(--red); color:var(--red); background:#fdf1f2;}

  .divider{height:1px; background:var(--line); margin:16px 0;}

  .close-x{
    position:absolute; top:14px; right:14px; background:none; border:none;
    font-size:20px; color:var(--graphite); padding:4px;
  }

  .detail-block{margin-bottom:16px;}
  .detail-block .dl-label{font-size:11.5px; font-weight:600; color:var(--graphite); font-family:'Archivo',sans-serif; margin-bottom:2px;}
  .detail-block .dl-value{font-size:14.5px; line-height:1.5;}

  .quote-summary{
    background:var(--paper); border-radius:6px; padding:12px 14px; margin-top:6px;
    display:flex; justify-content:space-between; gap:10px;
  }
  .quote-summary .qs-item{text-align:left;}
  .quote-summary .qs-num{font-family:'Archivo',sans-serif; font-weight:800; font-size:19px;}
  .quote-summary .qs-label{font-size:11px; color:var(--graphite); margin-top:1px;}

  .status-pipeline{display:flex; gap:4px; margin-bottom:16px;}
  .status-pipeline .seg{flex:1; height:4px; border-radius:2px; background:var(--line);}
  .status-pipeline .seg.done{background:var(--red);}
</style>
</head>

  </button>

    <span class="dot"></span>OPERATIONS
  </button>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

/* ---------- Firebase setup ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyCrMaQRXaRmbXLt_BZuQ0KTdaZ0gdNaWb4",
  authDomain: "united-sons.firebaseapp.com",
  projectId: "united-sons",
  storageBucket: "united-sons.firebasestorage.app",
  messagingSenderId: "214414379763",
  appId: "1:214414379763:web:84273c84ca889399de4586",
  measurementId: "G-JJCHZHNB7F"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const jobsCol = collection(db, "jobs");

/* IMPORTANT: once you deploy customer-upload.html, replace this with its real address,
   e.g. https://yourusername.github.io/united-sons-moving/customer-upload.html */
const UPLOAD_BASE_URL = "https://thewarehouseeg.github.io/United-Sons/customer-upload.html";
const PACKINGLIST_BASE_URL = "https://thewarehouseeg.github.io/United-Sons/supervisor-upload.html";

function uid(){ return 'j' + Date.now() + Math.floor(Math.random()*1000); }

async function saveJobFields(id, fields){
  await setDoc(doc(db, "jobs", id), fields, { merge: true });
}

let jobs = [];
let currentTab = 'files';

/* Live sync: any change here, on any device, updates everyone automatically */
onSnapshot(jobsCol, (snapshot)=>{
  jobs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  render();
});

/* Status order: lead -> survey_set -> quoted -> confirmed -> ops */
const STATUS_LABEL = {
  lead: 'NEW LEAD',
  survey_set: 'SURVEY SET',
  quoted: 'QUOTED',
  confirmed: 'CONFIRMED',
  ops: 'WITH OPERATIONS'
};
const STATUS_CLASS = {
  lead:'lead', survey_set:'survey', quoted:'quoted', confirmed:'confirmed', ops:'ops'
};

/* ---------- Tab switching ---------- */
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('viewTitle').textContent =
    tab==='files' ? 'Customer Files' : tab==='schedule' ? 'Survey Schedule' : 'Operations Queue';
  document.getElementById('fabBtn').style.display = tab==='files' ? 'flex' : 'none';
  render();
}

/* ---------- Rendering ---------- */
let searchQuery = '';

function getFilteredJobs(){
  if(!searchQuery) return jobs;
  const q = searchQuery.toLowerCase();
  const qDigits = searchQuery.replace(/[^\d]/g, '');
  return jobs.filter(j=>{
    const nameMatch = (j.name||'').toLowerCase().includes(q);
    const phoneMatch = qDigits && (j.phone||'').replace(/[^\d]/g,'').includes(qDigits);
    return nameMatch || phoneMatch;
  });
}

function render(){
  const main = document.getElementById('mainContent');
  if(!main) return;
  if(currentTab==='files') return renderFiles(main);
  if(currentTab==='schedule') return renderSchedule(main);
  if(currentTab==='ops') return renderOps(main);
}

function renderFiles(main){
  const filtered = getFilteredJobs();
  if(filtered.length===0){
    main.innerHTML = searchQuery
      ? emptyState('No matches', 'No customer files match your search.')
      : emptyState('No customer files yet', 'Tap the red + button to open a file as soon as someone calls in.');
    return;
  }
  const sorted = [...filtered].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  main.innerHTML = sorted.map(j=>fileCard(j)).join('');
}

function renderSchedule(main){
  const scheduled = getFilteredJobs().filter(j=>j.surveyDate).sort((a,b)=> {
    const dateCompare = new Date(a.surveyDate) - new Date(b.surveyDate);
    if(dateCompare !== 0) return dateCompare;
    return (a.surveyTime||'').localeCompare(b.surveyTime||'');
  });
  if(scheduled.length===0){
    main.innerHTML = searchQuery
      ? emptyState('No matches', 'No scheduled surveys match your search.')
      : emptyState('No surveys on the schedule', 'When you set a pre-move survey date on a file, it will show up here for operations to see.');
    return;
  }

  // Group by calendar day (YYYY-MM-DD)
  const groups = [];
  let currentDay = null;
  for(const j of scheduled){
    if(j.surveyDate !== currentDay){
      currentDay = j.surveyDate;
      groups.push({ day: currentDay, items: [] });
    }
    groups[groups.length-1].items.push(j);
  }

  const todayStr = new Date().toISOString().slice(0,10);

  main.innerHTML = groups.map(g=>{
    const d = new Date(g.day + 'T00:00:00');
    const isToday = g.day === todayStr;
    const dayLabel = d.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
    const cards = g.items.map(j=>{
      const timeStr = j.surveyTime || '';
      return `
      <div class="card" onclick="openDetail('${j.id}')">
        <div class="top-row">
          <div>
            <div class="name">${esc(j.name)}</div>
            <div class="route">${esc(j.pickup)} → ${esc(j.destination)}</div>
          </div>
          <span class="stamp ${STATUS_CLASS[j.status]}">${STATUS_LABEL[j.status]}</span>
        </div>
        <div class="meta-row">
          ${timeStr ? `<span>🕐 ${timeStr}</span>` : ''}
          <span>📞 ${esc(j.phone||'—')}</span>
        </div>
      </div>`;
    }).join('');
    return `
      <div class="section-label" style="${isToday ? 'color:var(--red); border-bottom-color:var(--red);' : ''}">
        ${isToday ? 'TODAY · ' : ''}${dayLabel.toUpperCase()}
      </div>
      ${cards}
    `;
  }).join('');
}

function renderOps(main){
  const opsJobs = getFilteredJobs().filter(j=>j.status==='ops');
  if(opsJobs.length===0){
    main.innerHTML = searchQuery
      ? emptyState('No matches', 'No operations jobs match your search.')
      : emptyState('No confirmed jobs yet', 'Once a quote is agreed and sent, the job will appear here for operations to assign and run.');
    return;
  }

  const undated = opsJobs.filter(j=>!j.opsDate).sort((a,b)=>(b.sentToOpsAt||0)-(a.sentToOpsAt||0));
  const dated = opsJobs.filter(j=>j.opsDate).sort((a,b)=>{
    const dateCompare = new Date(a.opsDate) - new Date(b.opsDate);
    if(dateCompare !== 0) return dateCompare;
    return (a.opsTime||'').localeCompare(b.opsTime||'');
  });

  const groups = [];
  let currentDay = null;
  for(const j of dated){
    if(j.opsDate !== currentDay){
      currentDay = j.opsDate;
      groups.push({ day: currentDay, items: [] });
    }
    groups[groups.length-1].items.push(j);
  }

  const todayStr = new Date().toISOString().slice(0,10);

  const opsCard = (j)=>`
    <div class="card" onclick="openDetail('${j.id}')">
      <div class="top-row">
        <div>
          <div class="name">${esc(j.name)}</div>
          <div class="route">${esc(j.pickup)} → ${esc(j.destination)}</div>
        </div>
        <span class="stamp ops">OPERATIONS</span>
      </div>
      <div class="quote-summary">
        <div class="qs-item">
          <div class="qs-num">${j.cbm ?? '—'}</div>
          <div class="qs-label">CUBIC METERS</div>
        </div>
        <div class="qs-item">
          <div class="qs-num">${j.price ? formatMoney(j.price) : '—'}</div>
          <div class="qs-label">AGREED PRICE</div>
        </div>
        <div class="qs-item">
          <div class="qs-num">${j.opsTime || '—'}</div>
          <div class="qs-label">MOVE TIME</div>
        </div>
      </div>
    </div>
  `;

  let html = '';

  if(undated.length){
    html += `<div class="section-label" style="color:var(--red); border-bottom-color:var(--red);">NOT YET SCHEDULED</div>`;
    html += undated.map(opsCard).join('');
  }

  html += groups.map(g=>{
    const d = new Date(g.day + 'T00:00:00');
    const isToday = g.day === todayStr;
    const dayLabel = d.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
    return `
      <div class="section-label" style="${isToday ? 'color:var(--red); border-bottom-color:var(--red);' : ''}">
        ${isToday ? 'TODAY · ' : ''}${dayLabel.toUpperCase()}
      </div>
      ${g.items.map(opsCard).join('')}
    `;
  }).join('');

  main.innerHTML = html;
}

function fileCard(j){
  return `
    <div class="card" onclick="openDetail('${j.id}')">
      <div class="top-row">
        <div>
          <div class="name">${esc(j.name)}</div>
          <div class="route">${esc(j.pickup)} → ${esc(j.destination)}</div>
        </div>
        <span class="stamp ${STATUS_CLASS[j.status]}">${STATUS_LABEL[j.status]}</span>
      </div>
      <div class="meta-row">
        <span>📞 ${esc(j.phone||'—')}</span>
        ${j.surveyDate ? `<span>📅 ${new Date(j.surveyDate).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span>` : ''}
        ${j.cbm ? `<span>📦 ${j.cbm} m³</span>` : ''}
        ${j.price ? `<span>💰 ${formatMoney(j.price)}</span>` : ''}
      </div>
    </div>
  `;
}

function emptyState(big, p){
  return `<div class="empty"><div class="big">${big}</div><p>${p}</p></div>`;
}

function esc(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function formatMoney(n){
  return Number(n).toLocaleString() + ' EGP';
}

/* Normalize Egyptian numbers for WhatsApp links (wa.me needs country code, no leading 0) */
function normalizeEgyptPhone(phone){
  let p = (phone||'').replace(/[^\d]/g,'');
  if(p.startsWith('0')) p = '20' + p.slice(1);
  else if(!p.startsWith('20')) p = '20' + p;
  return p;
}

/* ---------- Overlay / history handling so the device back gesture closes sheets ---------- */
let overlayOpen = false;
function openOverlay(html){
  const old = document.getElementById('overlay');
  if(old) old.remove();
  document.body.insertAdjacentHTML('beforeend', html);
  if(!overlayOpen){
    overlayOpen = true;
    history.pushState({ overlay: true }, '');
  }
}
function removeOverlayDom(){
  const o = document.getElementById('overlay');
  if(o) o.remove();
  if(currentPhotosUnsub){ currentPhotosUnsub(); currentPhotosUnsub = null; }
  if(currentPackingListUnsub){ currentPackingListUnsub(); currentPackingListUnsub = null; }
}
window.addEventListener('popstate', ()=>{
  overlayOpen = false;
  removeOverlayDom();
});

let pricingMode = null;
function selectPricingMode(mode){
  pricingMode = mode;
  document.getElementById('opt_photos').classList.toggle('selected', mode==='photos');
  document.getElementById('opt_survey').classList.toggle('selected', mode==='survey');
  document.getElementById('surveyFields').style.display = mode==='survey' ? 'block' : 'none';
}

async function saveNewLead(){
  const name = document.getElementById('f_name').value.trim();
  const phone = document.getElementById('f_phone').value.trim();
  const pickup = document.getElementById('f_pickup').value.trim();
  const dest = document.getElementById('f_dest').value.trim();
  const notes = document.getElementById('f_notes').value.trim();

  if(!name || !pickup || !dest){
    alert('Please fill in the customer name, pickup address, and destination.');
    return;
  }

  const job = {
    name, phone, pickup, destination: dest,
    pricingMode: pricingMode || 'photos',
    notes,
    status: pricingMode==='survey' ? 'survey_set' : 'lead',
    createdAt: Date.now(),
    cbm: null, price: null, customerResponse: '',
    surveyDate: null, surveyTime: null,
    sentToOpsAt: null,
    opsDate: null, opsTime: null
  };

  if(pricingMode==='survey'){
    const d = document.getElementById('f_surveyDate').value;
    const t = document.getElementById('f_surveyTime').value;
    if(d){ job.surveyDate = d; job.surveyTime = t; }
  }

  const id = uid();
  await saveJobFields(id, job);
  pricingMode = null;
  closeOverlay();
}

/* ---------- Detail sheet ---------- */

  if(!j) return;

  const currentIdx = statusSteps.indexOf(j.status);

    <div class="overlay" id="overlay" onclick="closeOverlayOutside(event)">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <button class="close-x" onclick="closeOverlay()">✕</button>
        <button class="close-x" style="right:44px; color:var(--red);" onclick="deleteJob('${j.id}')" title="Delete file">🗑</button>
        <h2>${esc(j.name)}</h2>
        <div class="sheet-sub">${esc(j.pickup)} → ${esc(j.destination)}</div>

        <div class="status-pipeline">
          ${statusSteps.map((s,i)=>`<div class="seg ${i<=currentIdx?'done':''}"></div>`).join('')}
        </div>
        <div class="stamp ${STATUS_CLASS[j.status]}" style="margin-bottom:16px; display:inline-block;">${STATUS_LABEL[j.status]}</div>

        <div class="detail-block">
          <div class="dl-label">PHONE</div>
          <div class="dl-value">${esc(j.phone||'—')}</div>
        </div>

        ${j.notes ? `<div class="detail-block"><div class="dl-label">CALL NOTES</div><div class="dl-value">${esc(j.notes)}</div></div>` : ''}

        <div class="divider"></div>

        <div class="section-label">Survey / Pricing method</div>
        <div class="field">
          <label>Method</label>
          <div class="radio-group">
            <div class="radio-opt ${j.pricingMode==='photos'?'selected':''}" onclick="setPricingModeDetail('${j.id}','photos')">Photos</div>
            <div class="radio-opt ${j.pricingMode==='survey'?'selected':''}" onclick="setPricingModeDetail('${j.id}','survey')">Survey visit</div>
          </div>
        </div>

        ${j.pricingMode==='photos' ? `
          <button class="btn btn-dark btn-block" onclick="sendPhotoLink('${j.id}')">Send photo upload link via WhatsApp</button>
          ${(!j.phone) ? '<div class="sheet-sub" style="margin-top:6px;">Add a phone number above so the link can be sent.</div>' : ''}
          <div id="photosBox" style="margin-top:12px;"><div class="sheet-sub">Loading photos…</div></div>
        ` : `
          <div class="field-row">
            <div class="field">
              <label>Survey date</label>
              <input type="date" id="d_surveyDate" value="${j.surveyDate||''}">
            </div>
            <div class="field">
              <label>Survey time</label>
              <input type="time" id="d_surveyTime" value="${j.surveyTime||''}">
            </div>
          </div>
          <button class="btn btn-outline btn-block" onclick="saveSurveySchedule('${j.id}')">Save to schedule</button>
        `}

        <div class="divider"></div>

        <div class="section-label">Quote & customer reply</div>
        <div class="field-row">
          <div class="field">
            <label>Cubic meters (CBM)</label>
            <input type="number" step="0.1" id="d_cbm" value="${j.cbm ?? ''}" placeholder="e.g. 22">
          </div>
          <div class="field">
            <label>Price (EGP)</label>
            <input type="number" id="d_price" value="${j.price ?? ''}" placeholder="e.g. 8500">
          </div>
        </div>
        <div class="field">
          <label>Customer's reply</label>
          <textarea id="d_response" placeholder="e.g. Agreed on price, wants to move on the 14th">${esc(j.customerResponse||'')}</textarea>
        </div>
        <button class="btn btn-outline btn-block" onclick="saveQuote('${j.id}')">Save quote</button>

        <div class="divider"></div>

        ${j.status==='ops' ?
          `<div class="detail-block"><div class="dl-label">STATUS</div><div class="dl-value">Sent to operations — ready for job assignment.</div></div>
          <div class="section-label">Operations day</div>
          <div class="field-row">
            <div class="field">
              <label>Move date</label>
              <input type="date" id="d_opsDate" value="${j.opsDate||''}">
            </div>
            <div class="field">
              <label>Move time</label>
              <input type="time" id="d_opsTime" value="${j.opsTime||''}">
            </div>
          </div>
          <button class="btn btn-outline btn-block" onclick="saveOpsDate('${j.id}')">Save operations day</button>
          <div class="divider"></div>
          <button class="btn btn-dark btn-block" onclick="sharePackingListLink('${j.id}')">Get packing list upload link</button>
          <div class="sheet-sub" style="margin-top:6px;">Share this with your supervisor so they can upload the client's packing list straight to this file.</div>
          <div id="packingListBox" style="margin-top:12px;"><div class="sheet-sub">Loading packing list…</div></div>`
          :
          `<div class="section-label">Operations day</div>
          <div class="field-row">
            <div class="field">
              <label>Move date</label>
              <input type="date" id="d_opsDate" value="${j.opsDate||''}">
            </div>
            <div class="field">
              <label>Move time</label>
              <input type="time" id="d_opsTime" value="${j.opsTime||''}">

let currentPhotosUnsub = null;
function attachPhotosListener(id){
  if(currentPhotosUnsub) currentPhotosUnsub();
  const photosQuery = query(collection(db, "jobs", id, "photos"), orderBy("uploadedAt", "asc"));
  currentPhotosUnsub = onSnapshot(photosQuery, (snapshot)=>{
    const box = document.getElementById('photosBox');
    if(!box) return; // sheet already closed
    if(snapshot.empty){
      box.innerHTML = '<div class="sheet-sub">No photos received yet.</div>';
      return;
    }
    const photos = snapshot.docs.map(d=>d.data());
    box.innerHTML = `
      <div class="section-label">Photos received (${photos.length})</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;">
        ${photos.map(p=>`<a href="${p.data}" target="_blank"><img src="${p.data}" style="width:72px;height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--line);"></a>`).join('')}
      </div>
    `;
  });
}

let currentPackingListUnsub = null;
function attachPackingListListener(id){
  if(currentPackingListUnsub) currentPackingListUnsub();
  const listQuery = query(collection(db, "jobs", id, "packingList"), orderBy("uploadedAt", "asc"));
  currentPackingListUnsub = onSnapshot(listQuery, (snapshot)=>{
    const box = document.getElementById('packingListBox');
    if(!box) return; // sheet already closed
    if(snapshot.empty){
      box.innerHTML = '<div class="sheet-sub">No packing list received yet.</div>';
      return;
    }
    const items = snapshot.docs.map(d=>d.data());
    box.innerHTML = `
      <div class="section-label">Packing list (${items.length})</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;">
        ${items.map(p=>`<a href="${p.data}" target="_blank"><img src="${p.data}" style="width:72px;height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--line);"></a>`).join('')}
      </div>
    `;
  });
}

async function sharePackingListLink(id){
  const link = `${PACKINGLIST_BASE_URL}?job=${id}`;
  const shareText = `Packing list upload link for this job: ${link}`;
  if(navigator.share){
    try{ await navigator.share({ title: 'Packing list upload link', text: shareText }); }
    catch(e){ /* user cancelled share sheet, no action needed */ }
  } else {
    try{
      await navigator.clipboard.writeText(link);
      alert('Link copied — paste it to your supervisor.');
    }catch(e){
      prompt('Copy this link to share with your supervisor:', link);
    }
  }
}

async function setPricingModeDetail(id, mode){
  await saveJobFields(id, { pricingMode: mode });
  openDetail(id);
}

function sendPhotoLink(id){
  const j = jobs.find(x=>x.id===id);
  if(!j) return;
  if(!j.phone){ alert('Add a phone number to this file first.'); return; }
  const link = `${UPLOAD_BASE_URL}?job=${j.id}`;
  const msg = `Hi ${j.name}, this is United Sons Moving Services. Please use this link to send us photos of the items you're moving so we can prepare your quote: ${link}`;
  const phone = normalizeEgyptPhone(j.phone);
  const waUrl = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
  window.open(waUrl, '_blank');
}

async function saveSurveySchedule(id){
  const j = jobs.find(x=>x.id===id);
  const d = document.getElementById('d_surveyDate').value;
  const t = document.getElementById('d_surveyTime').value;
  if(!d){ alert('Pick a survey date first.'); return; }
  const fields = { surveyDate: d, surveyTime: t };
  if(j.status==='lead') fields.status = 'survey_set';
  await saveJobFields(id, fields);
  openDetail(id);
}

async function saveQuote(id){
  const j = jobs.find(x=>x.id===id);
  const cbm = document.getElementById('d_cbm').value;
  const price = document.getElementById('d_price').value;
  const response = document.getElementById('d_response').value;
  const fields = {
    cbm: cbm ? Number(cbm) : null,
    price: price ? Number(price) : null,
    customerResponse: response
  };
  if(j.status!=='ops' && j.status!=='confirmed') fields.status = 'quoted';
  await saveJobFields(id, fields);
  openDetail(id);
}

async function sendToOperations(id){
  const j = jobs.find(x=>x.id===id);
  if(!j.cbm || !j.price){ alert('Add cubic meters and price first.'); return; }
  const opsDate = document.getElementById('d_opsDate').value;
  const opsTime = document.getElementById('d_opsTime').value;
  await saveJobFields(id, {
    status: 'ops',
    sentToOpsAt: Date.now(),
    opsDate: opsDate || null,
    opsTime: opsTime || null
  });
  closeOverlay();
  switchTab('ops');
}

async function saveOpsDate(id){
  const opsDate = document.getElementById('d_opsDate').value;
  const opsTime = document.getElementById('d_opsTime').value;
  if(!opsDate){ alert('Pick a move date first.'); return; }
  await saveJobFields(id, { opsDate, opsTime: opsTime || null });
  openDetail(id);
}

function closeOverlay(){
  if(overlayOpen){
    overlayOpen = false;
    history.back();
  } else {
    removeOverlayDom();
  }
}
function closeOverlayOutside(e){
  if(e.target.id==='overlay') closeOverlay();
}

async function deleteJob(id){
  if(!confirm('Delete this customer file? This cannot be undone.')) return;
  await deleteDoc(doc(db, "jobs", id));
  closeOverlay();
}

/* ---------- Expose functions used by inline onclick handlers ---------- */
window.switchTab = switchTab;
window.openNewLead = openNewLead;
window.selectPricingMode = selectPricingMode;
window.saveNewLead = saveNewLead;
window.openDetail = openDetail;
window.setPricingModeDetail = setPricingModeDetail;
window.deleteJob = deleteJob;
window.sendPhotoLink = sendPhotoLink;
window.sharePackingListLink = sharePackingListLink;
window.saveSurveySchedule = saveSurveySchedule;
window.saveOpsDate = saveOpsDate;
window.saveQuote = saveQuote;
window.sendToOperations = sendToOperations;
window.closeOverlay = closeOverlay;
window.closeOverlayOutside = closeOverlayOutside;

/* ---------- Init ---------- */
document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchQuery = e.target.value.trim();
  render();
});
render();
</script>
